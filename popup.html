<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 340px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    .header-icon {
      font-size: 28px;
    }
    
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 0;
    }
    
    .header .badge {
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 600;
      margin-left: auto;
    }
    
    .status-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
      min-height: 80px;
      border: 2px dashed #d1d5db;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .status-box.has-content {
      border-color: #10b981;
      background: #f0fdf4;
    }
    
    .status-box .status-icon {
      font-size: 32px;
      margin-bottom: 6px;
    }
    
    .status-box .status-text {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
      line-height: 1.5;
    }
    
    .status-box .status-text strong {
      color: #1a1a1a;
    }
    
    .status-box .preview-text {
      font-size: 12px;
      color: #374151;
      background: white;
      padding: 8px 12px;
      border-radius: 6px;
      width: 100%;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 8px;
      border: 1px solid #e5e7eb;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:active {
      transform: scale(0.98);
    }
    
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-success {
      background: #10b981;
      color: white;
    }
    
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }
    
    .shortcut-info {
      margin-top: 16px;
      padding: 10px;
      background: #f3f4f6;
      border-radius: 8px;
      font-size: 11px;
      color: #6b7280;
      text-align: center;
    }
    
    .shortcut-info kbd {
      background: #1a1a1a;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
    }
    
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #9ca3af;
      text-align: center;
    }
    
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a1a1a;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }
    
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="header-icon">📋</span>
      <h1>Smart Copy</h1>
      <span class="badge">v1.0</span>
    </div>
    
    <div class="status-box" id="statusBox">
      <div class="status-icon">📄</div>
      <div class="status-text">
        <strong>No text copied yet</strong><br>
        Copy text from any webpage first
      </div>
    </div>
    
    <button class="btn btn-primary" id="processBtn">
      🔄 Process & Copy to Word
    </button>
    
    <div class="shortcut-info">
      Or use shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>C</kbd>
    </div>
    
    <div class="footer">
      Copies with bold, italics, code, and lists preserved
    </div>
  </div>
  
  <div class="toast" id="toast">✅ Copy is Ready!</div>
  
  <script src="popup.js"></script>
</body>
</html>
