<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #ffffff;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f0f0f0;
    }
    
    .header h1 {
      font-size: 18px;
      margin: 0;
      color: #1a1a1a;
    }
    
    .badge {
      background: #10b981;
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    
    .info {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }
    
    .info strong {
      color: #1a1a1a;
    }
    
    .shortcut {
      background: #f0f0f0;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
      color: #333;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    
    .btn:hover {
      background: #0052a3;
    }
    
    .btn:active {
      transform: scale(0.98);
    }
    
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
      text-align: center;
      min-height: 20px;
    }
    
    .footer {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #f0f0f0;
      font-size: 11px;
      color: #999;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Smart Copy</h1>
    <span class="badge">Active</span>
  </div>
  
  <div class="info">
    <strong>How to use:</strong><br>
    Select any text on a webpage and press <strong>Ctrl+Shift+C</strong> to copy it with full styles for Microsoft Word.
  </div>
  
  <div class="shortcut">
    ⌨️ Ctrl + Shift + C
  </div>
  
  <button class="btn" id="copyBtn">📋 Copy Selected Text Now</button>
  
  <div class="status" id="status">Ready to copy</div>
  
  <div class="footer">
    v1.0 • Works on any website
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
